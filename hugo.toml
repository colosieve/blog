baseURL = '/'
languageCode = 'en-us'
title = "Colonel's Pensieve"
disableLiveReload = false

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[pagination]
  pagerSize = 10

[caches]
  [caches.getresource]
    maxAge = 0

[params]
  # Site banner image (path relative to static/, e.g., "images/banner.jpg")
  # Leave empty or remove to disable banner
  bannerImage = "images/banner.jpg"
  bannerAlt = "Site banner"
  bannerHeight = "205px"
