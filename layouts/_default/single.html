{{ define "main" }}
<div class="content-wrapper">
    <article>
        <div class="post-header">
            <div>
                <h1>{{ .Title }}</h1>
                <div class="post-meta">
                    <span>📅 <time>{{ .Date.Format "2006-01-02" }}</time></span>{{ with .Params.author }} <span class="author">👤 {{ . }}</span>{{ end }}
                </div>
            </div>
            {{ with .OutputFormats.Get "RawMarkdown" }}
            <a class="raw-download" href="{{ .RelPermalink }}" download="{{ $.File.ContentBaseName }}.md" aria-label="Download raw Markdown for {{ $.Title }}">
                <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="7 10 12 15 17 10"></polyline>
                    <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
                <span>Raw MD</span>
            </a>
            {{ end }}
        </div>
        {{ .Content }}
    </article>
    <aside class="toc-container">
        <nav class="toc" data-toc-depth="{{ .Params.toc_depth | default 2 }}">
            <h3 class="toc-title">Table of Contents <span class="toc-depth-hint">depth={{ .Params.toc_depth | default 2 }}</span></h3>
            <div class="toc-content"></div>
        </nav>
    </aside>
</div>
<a href="{{ .Site.BaseURL }}">← Back to home</a>
{{ end }}
